services:
  - type: web
    name: khoj-campus-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: COLLEGE_NAME
        value: "IIT Kanpur"
      - key: COLLEGE_TAG
        value: "IITK"
      - key: MAX_IMAGE_UPLOAD_MB
        value: "5"
